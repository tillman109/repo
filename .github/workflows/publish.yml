name: Publish Tweak Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 apt-utils

      - name: Generate repository
        run: |
          mkdir -p _site/debs

          if [ -d debs ]; then
            cp -a debs/. _site/debs/
          fi

          cd _site
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Tillman's Repo" \
            -o APT::FTPArchive::Release::Label="Tillman's Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64e iphoneos-arm64 iphoneos-arm" \
            -o APT::FTPArchive::Release::Description="Personal iOS Tweak Repository" \
            release . > /tmp/Release

          mv /tmp/Release Release
          echo "<h1>Tillman's Repo</h1><p>Personal iOS Tweak Repository</p>" > index.html
          touch .nojekyll

      - name: Name this upload
        id: package
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload repository
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for the uploaded artifact to appear
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in {1..24}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count') || exit 1
            if [[ "$count" == "1" ]]; then exit 0; fi
            if [[ "$count" != "0" ]]; then
              echo "::error::Found $count artifacts named $ARTIFACT_NAME"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Artifact $ARTIFACT_NAME did not appear within two minutes"
          exit 1

      - name: Publish repository
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
